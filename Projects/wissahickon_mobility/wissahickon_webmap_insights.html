    var boundaryLayer = L.geoJson(boundaryData, {
        style: { color: '#2ecc71', weight: 2, dashArray: '5, 5', fillOpacity: 0.05 }
    }).addTo(map);

    var trafficLayer = L.geoJson(trafficData, {
        style: function(feature) {
            var vol = feature.properties.total_traversals || 1;
            return { color: '#3498db', weight: 1.5 + (vol * 0.8), opacity: 0.85 };
        },
        onEachFeature: function (feature, layer) {
            layer.bindTooltip("Trail: " + (feature.properties.name || "Un-named") + "<br>Traversals: " + feature.properties.total_traversals);
        }
    }).addTo(map);

    var staysLayer = L.geoJson(staysData, {
        pointToLayer: function (feature, latlng) {
            var dwell = feature.properties.dwell_minutes || 15;
            return L.circleMarker(latlng, {
                radius: 4 + (dwell / 6),
                fillColor: '#e74c3c', color: '#ffffff', weight: 0.8, fillOpacity: 0.8
            });
        },
        onEachFeature: function (feature, layer) {
            layer.bindPopup("<b>Stay ID:</b> " + feature.properties.stay_id + "<br><b>Dwell Time:</b> " + feature.properties.dwell_minutes + " min");
        }
    }).addTo(map);

    var originsLayer = L.geoJson(originsData, {
        pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
                radius: 4, fillColor: '#9b59b6', color: '#ffffff', weight: 0.5, fillOpacity: 0.7
            });
        },
        onEachFeature: function (feature, layer) {
            layer.bindTooltip("Device Origin<br>Dist: " + feature.properties.dist_miles + " mi");
        }
    }).addTo(map);

    // Legend Control
    var legend = L.control({position: 'bottomright'});
    legend.onAdd = function (map) {
        var div = L.DomUtil.create('div', 'legend');
        div.innerHTML = '<h4>Derived Metrics</h4>' +
            '<div class="legend-item"><span class="legend-line"></span> Trail Traffic (Width = Volume)</div>' +
            '<div class="legend-item"><span class="legend-key" style="background:#e74c3c;"></span> Stay-Points (Size = Dwell Time)</div>' +
            '<div class="legend-item"><span class="legend-key" style="background:#9b59b6;"></span> Device Origin (LODES)</div>';
        return div;
    };
    legend.addTo(map);

    L.control.layers(null, {
        "Park Boundary": boundaryLayer,
        "Trail Traffic Volume": trafficLayer,
        "Stay-Points (>15 min Dwell)": staysLayer,
        "Device Home Origins": originsLayer
    }, { collapsed: false, position: 'topright' }).addTo(map);
